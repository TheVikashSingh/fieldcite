name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16

  spec-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/spec-guard.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # No API keys here: tests use mocked engine responses only (CS-12).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dry-run scan from fixtures
        run: npm run scan -- --category pest-control --country US --questions 3 --runs 1 --dry-run
      # Sentinel values, not secrets: the bundle check fails if any reaches the browser (CS-12).
      - name: Build
        run: npm run build
        env: &sentinels
          OPENAI_API_KEY: sentinel-openai-build-7d21
          PERPLEXITY_API_KEY: sentinel-perplexity-build-7d21
          GEMINI_API_KEY: sentinel-gemini-build-7d21
          DATABASE_URL: postgres://sentinel-build-7d21@localhost:1/sentinel
          NEXT_TELEMETRY_DISABLED: "1"
      - name: No secrets in client bundles
        run: bash scripts/check-client-bundle.sh
        env: *sentinels

  db-test:
    runs-on: ubuntu-latest
    # Credit ledger concurrency tests (CS-4, CS-5) against a throwaway Postgres. No secrets.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      # Applying twice checks the runner skips migrations it has already applied.
      - run: npm run db:migrate
      - run: npm run test:db
